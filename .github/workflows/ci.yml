name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.3-pg18
        env:
          POSTGRES_USER: ragground
          POSTGRES_PASSWORD: ragground
          POSTGRES_DB: ragground
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragground" --health-interval 5s --health-retries 10
    env:
      RAGGROUND_TEST_DATABASE_URL: postgresql+asyncpg://ragground:ragground@localhost:5432/ragground_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy src
      - name: Migrations match models
        env:
          RAGGROUND_DATABASE_URL: postgresql+asyncpg://ragground:ragground@localhost:5432/ragground
        run: uv run alembic upgrade head && uv run alembic check
      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build api web
